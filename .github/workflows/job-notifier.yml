name: Gowtham Job Notifier

on:
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Europe/Prague"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gowtham-job-notifier
  cancel-in-progress: false

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POST_RUN_SUMMARY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore notifier state
        uses: actions/cache@v4
        with:
          path: |
            jobs.db
            bot_state.json
          key: job-notifier-state-${{ github.run_id }}
          restore-keys: |
            job-notifier-state-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate configuration
        run: python main.py --validate

      - name: Validate Telegram destination
        run: python main.py --check-telegram

      - name: Run notifier
        run: python main.py
